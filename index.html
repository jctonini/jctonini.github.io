<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis proyectos</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --line: #d9dde5; --accent: #1f5eff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171d; --card: #1d222b; --text: #e8ebf0; --muted: #98a1b3; --line: #343b48; --accent: #6b9bff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; gap: 12px; }
    a.card { display: block; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); }
    a.card h2 { margin: 0 0 4px; font-size: 1.1rem; color: var(--accent); }
    a.card p { margin: 0; color: var(--muted); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Mis proyectos</h1>
    <p class="sub">Herramientas y materiales de la cátedra.</p>
    <div class="grid">
      <!-- Para agregar otro proyecto, copiá este bloque <a>…</a>, cambiá el enlace, el título y la descripción. -->
      <a class="card" href="/METSI/">
        <h2>Corrector de multiple choice · METSI</h2>
        <p>Corrige exámenes en papel a partir de una foto de la hoja de respuestas y guarda los resultados en Google Drive.</p>
      </a>
    </div>
  </main>
</body>
</html>
